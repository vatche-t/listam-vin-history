<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #status {
        padding: 8px 10px;
        border-radius: 6px;
        background: #f1f3f4;
        margin-bottom: 10px;
        word-break: break-word;
      }
      #status.found { background: #fce8e6; }
      #status.not_found { background: #e6f4ea; }
      #status.blocked, #status.error, #status.invalid_vin { background: #fef7e0; }
      code { font-size: 12px; }
      .buttons { display: flex; gap: 8px; margin-bottom: 10px; }
      button {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
      button:hover { background: #f8f9fa; }
      button:disabled { opacity: 0.5; cursor: default; }
      label { display: flex; gap: 6px; align-items: center; color: #444; }
      a { color: #1a73e8; }
      #msg { color: #188038; min-height: 18px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>List.am VIN History</h1>
    <div id="status">…</div>
    <div class="buttons">
      <button id="recheck" disabled>Re-check</button>
      <button id="clear">Clear cache</button>
    </div>
    <label><input type="checkbox" id="manualVin" /> Show manual VIN input on listings without a VIN</label>
    <div id="msg"></div>
    <div class="buttons">
      <button id="mcp" aria-describedby="mcp-status" disabled>Connect MCP</button>
    </div>
    <div id="mcp-status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
